definitions:
  domain.Category:
    enum:
    - science
    - tech
    - architecture_and_urban
    - sport
    - music
    type: string
    x-enum-varnames:
    - CategoryScience
    - CategoryTech
    - CategoryArchitectureAndUrban
    - CategorySport
    - CategoryMusic
  domain.CreateProjectReq:
    properties:
      category:
        $ref: '#/definitions/domain.Category'
      currency:
        $ref: '#/definitions/domain.Currency'
      description:
        type: string
      durationDays:
        type: integer
      goalAmount:
        type: integer
      name:
        type: string
    type: object
  domain.Currency:
    enum:
    - RUB
    - USD
    type: string
    x-enum-varnames:
    - CurrencyRUB
    - CurrencyUSD
  domain.GetProjectsResp:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.Project'
        type: array
    type: object
  domain.Project:
    properties:
      category:
        $ref: '#/definitions/domain.Category'
      currency:
        $ref: '#/definitions/domain.Currency'
      currentAmount:
        type: integer
      description:
        type: string
      durationDays:
        type: integer
      goalAmount:
        type: integer
      id:
        type: string
      isBoosted:
        type: boolean
      name:
        type: string
      startedAt:
        type: string
      status:
        $ref: '#/definitions/domain.Status'
      userID:
        type: string
    type: object
  domain.Status:
    enum:
    - review
    - active
    - finished
    type: string
    x-enum-varnames:
    - StatusReview
    - StatusActive
    - StatusFinished
  handler.BoostProjectReq:
    properties:
      promoCode:
        type: string
    type: object
  handler.RejectProjectReq:
    properties:
      reason:
        type: string
    type: object
  httplib.ErrResp:
    properties:
      code:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
info:
  contact: {}
  description: Projects service API for a crowdfunding app.
  title: Project service API
  version: "1.0"
paths:
  /manager/applications/{id}/approve:
    post:
      description: Approves a project application and moves project to active.
      parameters:
      - description: User ID (UUID)
        in: header
        name: X-User-ID
        required: true
        type: string
      - description: User role (must be Manager)
        in: header
        name: X-User-Role
        required: true
        type: string
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: status=ok
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid project id
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "403":
          description: forbidden
          schema:
            type: string
        "409":
          description: project_not_on_review
          schema:
            $ref: '#/definitions/httplib.ErrResp'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/httplib.ErrResp'
      summary: Approve project application
      tags:
      - manager
  /manager/applications/{id}/reject:
    post:
      consumes:
      - application/json
      description: Rejects a project application with reason.
      parameters:
      - description: User ID (UUID)
        in: header
        name: X-User-ID
        required: true
        type: string
      - description: User role (must be Manager)
        in: header
        name: X-User-Role
        required: true
        type: string
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Reject reason payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RejectProjectReq'
      produces:
      - application/json
      responses:
        "200":
          description: status=ok
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid project id | invalid request body
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "403":
          description: forbidden
          schema:
            type: string
        "409":
          description: project_not_on_review
          schema:
            $ref: '#/definitions/httplib.ErrResp'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/httplib.ErrResp'
      summary: Reject project application
      tags:
      - manager
  /projects:
    get:
      description: Returns a paginated list of projects filtered by status, category
        and search.
      parameters:
      - description: 'Status filter (active|finished), default: active'
        in: query
        name: status
        type: string
      - description: 'Sort order (default|date), default: default'
        in: query
        name: sort
        type: string
      - description: Category filter (science|tech|architecture_and_urban|sport|music)
        in: query
        name: category
        type: string
      - description: Search by name
        in: query
        name: search
        type: string
      - description: 'Page size (1-100, default: 20)'
        in: query
        name: limit
        type: integer
      - description: 'Offset (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.GetProjectsResp'
        "400":
          description: unknown_status | unknown_sort | unknown_category
          schema:
            $ref: '#/definitions/httplib.ErrResp'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/httplib.ErrResp'
      summary: Get projects
      tags:
      - project
    post:
      consumes:
      - application/json
      description: Creates a new project by given payload.
      parameters:
      - description: User ID (UUID)
        in: header
        name: X-User-ID
        required: true
        type: string
      - description: Project create payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CreateProjectReq'
      produces:
      - application/json
      responses:
        "201":
          description: created
          schema:
            type: string
        "400":
          description: validation_error | invalid request body
          schema:
            $ref: '#/definitions/httplib.ErrResp'
        "401":
          description: unauthorized
          schema:
            type: string
        "405":
          description: method not allowed
          schema:
            type: string
        "409":
          description: project_exists
          schema:
            $ref: '#/definitions/httplib.ErrResp'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/httplib.ErrResp'
      summary: Create project
      tags:
      - project
  /projects/{id}:
    get:
      description: Returns a project by its id.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Project'
        "400":
          description: invalid project id
          schema:
            type: string
        "404":
          description: project_not_found
          schema:
            $ref: '#/definitions/httplib.ErrResp'
        "405":
          description: method not allowed
          schema:
            type: string
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/httplib.ErrResp'
      summary: Get project by id
      tags:
      - project
  /projects/{id}/boost:
    post:
      consumes:
      - application/json
      description: Boosts a project visibility using a promo code.
      parameters:
      - description: User ID (UUID)
        in: header
        name: X-User-ID
        required: true
        type: string
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Promo code payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.BoostProjectReq'
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            type: string
        "400":
          description: invalid project id | invalid request body
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
        "403":
          description: promo_code_access_denied
          schema:
            $ref: '#/definitions/httplib.ErrResp'
        "404":
          description: project_not_found | promo_code_not_found
          schema:
            $ref: '#/definitions/httplib.ErrResp'
        "409":
          description: promo_code_already_used
          schema:
            $ref: '#/definitions/httplib.ErrResp'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/httplib.ErrResp'
      summary: Boost project
      tags:
      - project
swagger: "2.0"
